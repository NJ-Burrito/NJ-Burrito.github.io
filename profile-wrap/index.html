<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile-Wrap has moved</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://nj-burrito.github.io/Profile-Wrap/">
<meta http-equiv="refresh" content="0; url=https://nj-burrito.github.io/Profile-Wrap/">
<script>
  var target = "https://nj-burrito.github.io/Profile-Wrap/";
  var m = location.pathname.match(/^\/profile-wrap\/(.*)$/i);
  var rest = m ? m[1] : "";
  location.replace(target + rest + location.search + location.hash);
</script>
</head>
<body>
<p>Profile-Wrap has moved to <a href="https://nj-burrito.github.io/Profile-Wrap/">https://nj-burrito.github.io/Profile-Wrap/</a>.</p>
</body>
</html>
